name: Geopolitical forecast (manual)

# Runs ONLY when you click "Run workflow". Choose the simple or the advanced bot.
# Never publishes to Metaculus: it does not receive METACULUS_TOKEN at all.
on:
  workflow_dispatch:
    inputs:
      bot:
        description: "simple = geo_forecaster.py (one web search model) | advanced = advanced_bot (research agent, 3 models, critique loop)"
        type: choice
        options: [simple, advanced]
        default: simple
      question:
        description: "Yes/no question (leave empty to use questions/example_question.json)"
        required: false
        default: ""
      resolution_date:
        description: "Resolution date YYYY-MM-DD (required if you wrote a question)"
        required: false
        default: ""
      resolution_criteria:
        description: "Exactly what counts as YES (optional)"
        required: false
        default: ""
      runs:
        description: "simple bot only: number of independent forecasts (1-5)"
        required: false
        default: "3"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ---------------- simple bot ----------------
      - name: Install dependencies (simple)
        if: inputs.bot == 'simple'
        run: pip install requests python-dotenv
      - name: Run simple forecaster
        if: inputs.bot == 'simple'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEO_MODEL: ${{ vars.GEO_MODEL }}
          # Inputs are passed through env (not pasted into the script) so that
          # quotes or special characters in your question can't break the command.
          IN_QUESTION: ${{ inputs.question }}
          IN_DATE: ${{ inputs.resolution_date }}
          IN_CRITERIA: ${{ inputs.resolution_criteria }}
          IN_RUNS: ${{ inputs.runs }}
        run: |
          [ -z "$GEO_MODEL" ] && unset GEO_MODEL
          args=(--runs "${IN_RUNS:-3}")
          if [ -n "$IN_QUESTION" ]; then
            args+=(--question "$IN_QUESTION" --resolution-date "$IN_DATE")
            [ -n "$IN_CRITERIA" ] && args+=(--resolution-criteria "$IN_CRITERIA")
          else
            args+=(--question-file questions/example_question.json)
          fi
          python geo_forecaster.py "${args[@]}"

      # ---------------- advanced bot ----------------
      - name: Install poetry (advanced)
        if: inputs.bot == 'advanced'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies (advanced)
        if: inputs.bot == 'advanced'
        run: poetry install --no-interaction --no-root
      - name: Run advanced forecaster
        if: inputs.bot == 'advanced'
        env:
          # No METACULUS_TOKEN here: custom questions are never published.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FUTURESEARCH_API_KEY: ${{ secrets.FUTURESEARCH_API_KEY }}
          IN_QUESTION: ${{ inputs.question }}
          IN_DATE: ${{ inputs.resolution_date }}
          IN_CRITERIA: ${{ inputs.resolution_criteria }}
        run: |
          args=(--mode custom)
          if [ -n "$IN_QUESTION" ]; then
            args+=(--question "$IN_QUESTION" --resolution-date "$IN_DATE")
            [ -n "$IN_CRITERIA" ] && args+=(--resolution-criteria "$IN_CRITERIA")
          else
            args+=(--question-file questions/example_question.json)
          fi
          poetry run python run_advanced.py "${args[@]}"
          # show the full report (with the Arabic summary) on the run page
          shopt -s nullglob
          for f in logs/advanced/*/*.md; do cat "$f" >> "$GITHUB_STEP_SUMMARY"; done
      - name: Save results as a downloadable file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-forecast-results
          path: |
            results/
            logs/advanced/
          if-no-files-found: ignore
          retention-days: 30
